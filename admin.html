<div id="admin-lock" style="position:fixed;inset:0;z-index:999999;background:#0b0f19;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;">
  <div style="background:#131a2a;border:1px solid rgba(255,255,255,0.1);padding:28px;border-radius:14px;width:90%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.6);">

    <p style="color:#94a3b8;font-size:13px;margin:0 0 18px;">Enter password to continue</p>
    <input id="admin-pass-input" type="password" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Password..." style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;margin-bottom:12px;outline:none;" />
    <button id="admin-pass-btn" style="width:100%;padding:12px;border-radius:8px;border:none;background:linear-gradient(90deg,#9333ea,#e879f9);color:#fff;font-weight:700;font-size:15px;cursor:pointer;">Unlock</button>
    <p id="admin-pass-err" style="color:#ef4444;font-size:13px;margin:10px 0 0;display:none;">Wrong password!</p>
  </div>
</div>
<script>
(function(){
  const PASS = "Youssef23@";
  const box = document.getElementById("admin-lock");
  if (sessionStorage.getItem("cs_admin_ok") === "1") { box.remove(); return; }
  const input = document.getElementById("admin-pass-input");
  const btn = document.getElementById("admin-pass-btn");
  const err = document.getElementById("admin-pass-err");
  function check() {
    if (input.value.trim() === PASS) {
      sessionStorage.setItem("cs_admin_ok", "1");
      box.remove();
    } else {
      err.style.display = "block";
      input.value = "";
      input.focus();
    }
  }
  btn.onclick = check;
  input.onkeydown = (e) => { if (e.key === "Enter") check(); };
  input.focus();
})();
</script>

<style>
  .tm-wrap { max-width: 1100px; margin: 20px auto; padding: 18px; background: #111827; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; font-family: system-ui, sans-serif; color: #f8fafc; }
  .tm-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .tm-head h2 { margin: 0; font-size: 18px; color: #2dd4bf; }
  .tm-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tm-tab { padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #cbd5e1; font-size: 13px; cursor: pointer; font-weight: 600; }
  .tm-tab.active { background: #2dd4bf; color: #0f172a; border-color: #2dd4bf; }
  .tm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .tm-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .tm-top { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; font-weight: 700; }
  .tm-badge { background: #0f172a; color: #38bdf8; padding: 2px 7px; border-radius: 6px; }
  .tm-teams { font-size: 14px; font-weight: 700; color: #fff; }
  .tm-btn { padding: 8px; border-radius: 8px; border: none; background: linear-gradient(90deg,#9333ea,#e879f9); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .tm-btn:hover { opacity: 0.9; }
</style>

<div class="tm-wrap" id="tm-widget">
  <div class="tm-head">
    <h2>📅 Today's Matches (Auto-Fetch)</h2>
    <button class="tm-tab active" onclick="tmLoadAll()">🔄 Refresh</button>
  </div>
  <div class="tm-tabs" id="tm-tabs">
    <button class="tm-tab active" onclick="tmFilter('ALL', this)">All</button>
    <button class="tm-tab" onclick="tmFilter('NBA', this)">🏀 NBA</button>
    <button class="tm-tab" onclick="tmFilter('NFL', this)">🏈 NFL</button>
    <button class="tm-tab" onclick="tmFilter('Soccer', this)">⚽ Soccer</button>
    <button class="tm-tab" onclick="tmFilter('NHL', this)">🏒 NHL</button>
    <button class="tm-tab" onclick="tmFilter('UFC', this)">🥊 UFC</button>
  </div>
  <div class="tm-grid" id="tm-grid"><p style="color:#94a3b8">Loading today's matches...</p></div>
</div>

<script>
let TM_MATCHES = [];
let TM_CUR_FILTER = "ALL";

const TM_FEEDS = [
  { sport: "NBA", league: "NBA", url: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" },
  { sport: "NFL", league: "NFL", url: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" },
  { sport: "NHL", league: "NHL", url: "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard" },
  { sport: "Soccer", league: "Champions League", url: "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard" },
  { sport: "Soccer", league: "Premier League", url: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard" },
  { sport: "Soccer", league: "La Liga", url: "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard" },
  { sport: "UFC", league: "UFC", url: "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard" }
];

async function tmLoadAll() {
  const grid = document.getElementById("tm-grid");
  grid.innerHTML = '<p style="color:#94a3b8">Fetching live schedule...</p>';
  TM_MATCHES = [];
  await Promise.all(TM_FEEDS.map(async (f) => {
    try {
      const res = await fetch(f.url);
      const data = await res.json();
      (data.events || []).forEach(ev => {
        const comp = ev.competitions && ev.competitions[0];
        const comps = (comp && comp.competitors) || [];
        const home = comps.find(c => c.homeAway === "home") || comps[0];
        const away = comps.find(c => c.homeAway === "away") || comps[1];
        const homeName = (home && ((home.team && home.team.displayName) || (home.athlete && home.athlete.displayName))) || ev.name;
        const awayName = (away && ((away.team && away.team.displayName) || (away.athlete && away.athlete.displayName))) || "";
        const dt = new Date(ev.date);
        const timeStr = dt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
        const state = ev.status && ev.status.type && ev.status.type.state;
        const isLive = state === "in";
        const isDone = state === "post";
        const status = isLive ? "🔴 LIVE" : (isDone ? "✅ Final (" + timeStr + ")" : "🕒 " + timeStr);
        TM_MATCHES.push({
          sport: f.sport,
          league: f.league,
          home: homeName,
          away: awayName,
          title: awayName ? (homeName + " vs " + awayName) : homeName,
          time: timeStr,
          ts: dt.getTime(),
          isLive: isLive,
          status: status
        });
      });
    } catch (e) {}
  }));
  TM_MATCHES.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  tmRender();
}

function tmFilter(sport, btn) {
  TM_CUR_FILTER = sport;
  document.querySelectorAll("#tm-tabs .tm-tab").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  tmRender();
}

function tmRender() {
  const grid = document.getElementById("tm-grid");
  const list = TM_CUR_FILTER === "ALL" ? TM_MATCHES : TM_MATCHES.filter(m => m.sport === TM_CUR_FILTER);
  if (!list.length) {
    grid.innerHTML = '<p style="color:#94a3b8">No matches found for this category today.</p>';
    return;
  }
  grid.innerHTML = list.map(m => {
    const idx = TM_MATCHES.indexOf(m);
    return '<div class="tm-card">' +
      '<div class="tm-top"><span class="tm-badge">' + m.league + '</span><span style="color:' + (m.isLive ? '#ef4444' : '#facc15') + ';font-size:12px;">' + m.status + '</span></div>' +
      '<div class="tm-teams">' + m.title + '</div>' +
      '<button class="tm-btn" onclick="tmFill(' + idx + ')">+ Fill Form</button>' +
    '</div>';
  }).join("");
}

function tmFill(idx) {
  const m = TM_MATCHES[idx];
  if (!m) return;
  const inputs = Array.from(document.querySelectorAll("input, select"));
  const setVal = (regex, val) => {
    const el = inputs.find(i => regex.test((i.id + " " + i.name + " " + (i.placeholder || "")).toLowerCase()));
    if (el) {
      el.value = val;
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }
  };
  setVal(/home|team1|team_a/, m.home);
  setVal(/away|team2|team_b/, m.away);
  setVal(/title|match|name/, m.title);
  setVal(/league|comp/, m.league);
  setVal(/sport|cat/, m.sport);
  setVal(/time|hour|kickoff/, m.time);
  const streamInput = inputs.find(i => /stream|url|embed|link/.test((i.id + " " + i.name + " " + (i.placeholder || "")).toLowerCase()));
  if (streamInput) {
    streamInput.scrollIntoView({ behavior: "smooth", block: "center" });
    streamInput.focus();
  }
}

window.addEventListener("DOMContentLoaded", tmLoadAll);
</script>
<!-- /TODAY_MATCHES_WIDGET -->

      </div>

  <script>
    const sb = window.supabase.createClient("https://uwyljkxcfcqmteltjzxu.supabase.co", "sb_publishable_5E_ajIPbGSP0Kx9a_LJJXQ_xiG4Jahx");

    const ESPN_FEEDS = [
      { sport: "football", league: "Champions League", url: "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard" },
      { sport: "football", league: "Premier League", url: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard" },
      { sport: "football", league: "La Liga", url: "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard" },
      { sport: "basketball", league: "NBA", url: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" },
      { sport: "american-football", league: "NFL", url: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" },
      { sport: "fight", league: "UFC", url: "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard" }
    ];

    function setStatus(msg) {
      const el = document.getElementById("status-bar");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    async function autoFetchMatches() {
      const btn = document.getElementById("btn-fetch");
      btn.disabled = true;
      btn.textContent = "⏳ Fetching...";
      setStatus("Fetching today's matches from ESPN...");

      const { data: existing } = await sb.from("us_matches").select("title");
      const existingTitles = new Set((existing || []).map(m => m.title));

      let added = 0;
      for (const feed of ESPN_FEEDS) {
        try {
          const res = await fetch(feed.url);
          const data = await res.json();
          const events = data.events || [];
          for (const ev of events) {
            const title = ev.shortName || ev.name;
            if (!title || existingTitles.has(title)) continue;
            const d = new Date(ev.date);
            const timeStr = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }) + " GMT";
            const isLive = ev.status?.type?.state === "in";
            await sb.from("us_matches").insert([{
              title, sport: feed.sport, league: feed.league,
              match_time: timeStr, is_live: isLive, stream_url: "", server2_url: ""
            }]);
            existingTitles.add(title);
            added++;
          }
        } catch (e) {}
      }

      btn.disabled = false;
      btn.textContent = "🔄 Auto-Fetch Today's Matches";
      setStatus(added > 0 ? `✅ Added ${added} new matches! Now paste your embed links below.` : "✅ Schedule is already up to date.");
      loadAll();
    }

    async function loadAll() {
      const { data: ms } = await sb.from("us_matches").select("*").order("id", { ascending: false });
      document.getElementById("matches-list").innerHTML = (ms || []).length ? (ms || []).map(m => `
        <div class="p-3 bg-slate-900 border ${m.stream_url ? "border-emerald-500/40" : "border-slate-800"} rounded-xl space-y-2">
          <div class="flex flex-wrap items-center justify-between gap-2 text-sm">
            <div>
              <span class="px-2 py-0.5 rounded bg-slate-800 text-pink-400 text-[11px] font-bold mr-1">${m.league}</span>
              <span class="font-bold text-white">${m.title}</span>
              <span class="text-xs text-slate-400 ml-1">(${m.match_time})</span>
              ${m.is_live ? "🔴" : ""}
              ${m.stream_url ? '<span class="text-emerald-400 text-xs font-bold ml-2">✓ Link Ready</span>' : '<span class="text-amber-400 text-xs ml-2">No link yet</span>'}
            </div>
            <div class="flex gap-2">
              <button onclick="toggleLive(${m.id}, ${!m.is_live})" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs">${m.is_live ? "Stop Live" : "Set Live"}</button>
              <button onclick="delMatch(${m.id})" class="px-2.5 py-1 rounded bg-red-500/20 text-red-400 text-xs">Delete</button>
            </div>
          </div>
          <div class="flex gap-2">
            <input id="url-${m.id}" value="${m.stream_url || ""}" placeholder="Paste Server 1 Embed URL (https://...)" class="flex-1 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white" />
            <button onclick="saveLink(${m.id})" class="px-4 py-1.5 rounded-lg bg-fuchsia-600 hover:bg-fuchsia-500 text-xs font-bold text-white">Save Link</button>
          </div>
        </div>`).join("") : '<p class="text-slate-500 text-sm py-4">No matches yet. Click "Auto-Fetch Today's Matches" above!</p>';

      const { data: cs } = await sb.from("us_channels").select("*").order("id", { ascending: false });
      document.getElementById("channels-list").innerHTML = (cs || []).map(c => `
        <div class="flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded-lg text-sm">
          <div><span class="font-bold text-white">${c.name}</span> <span class="text-xs text-slate-400">(${c.country})</span></div>
          <button onclick="delChannel(${c.id})" class="px-2.5 py-1 rounded bg-red-500/20 text-red-400 text-xs">Delete</button>
        </div>`).join("");
    }

    async function saveLink(id) {
      const url = document.getElementById("url-" + id).value.trim();
      await sb.from("us_matches").update({ stream_url: url }).eq("id", id);
      setStatus("✅ Stream link saved! Live immediately on site.");
      loadAll();
    }

    async function clearOldMatches() {
      if (!confirm("Delete ALL matches from schedule?")) return;
      await sb.from("us_matches").delete().neq("id", 0);
      loadAll();
    }

    async function addChannel() {
      const name = document.getElementById("c-name").value.trim();
      const stream_url = document.getElementById("c-url").value.trim();
      if (!name || !stream_url) return alert("Channel Name & URL required!");
      await sb.from("us_channels").insert([{
        name, country: document.getElementById("c-country").value.trim() || "UK",
        category: document.getElementById("c-cat").value.trim() || "Sports", stream_url
      }]);
      document.getElementById("c-name").value = ""; document.getElementById("c-url").value = "";
      loadAll();
    }

    async function toggleLive(id, val) { await sb.from("us_matches").update({ is_live: val }).eq("id", id); loadAll(); }
    async function delMatch(id) { await sb.from("us_matches").delete().eq("id", id); loadAll(); }
    async function delChannel(id) { await sb.from("us_channels").delete().eq("id", id); loadAll(); }

    loadAll();
  </script>
</body>
